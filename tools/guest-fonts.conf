<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Point host fontconfig at the GUEST font tree so host renders (uishot.py)
     resolve exactly the faces the guest ships (Nimbus Sans, Newsreader, DejaVu,
     Noto CJK). Use with FONTCONFIG_FILE=tools/guest-fonts.conf. -->
<fontconfig>
  <!-- overlay first: fonts added to the overlay are visible to renders before
       the next buildroot rebuild copies them into output/target -->
  <dir>/home/ben/Documents/notebookos-linux/buildroot/board/notebookos/rootfs-overlay/usr/share/fonts</dir>
  <dir>/home/ben/Documents/notebookos-linux/buildroot/output/target/usr/share/fonts</dir>
  <cachedir>/tmp/nb-fontcache</cachedir>
  <include ignore_missing="no">/home/ben/Documents/notebookos-linux/buildroot/output/target/etc/fonts/conf.d</include>
</fontconfig>
