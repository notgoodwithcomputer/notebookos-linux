<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; background: #cdcabf; }
  .cl-scroll::-webkit-scrollbar { width: 12px; }
  .cl-scroll::-webkit-scrollbar-thumb { background: #D8D2C4; border: 3px solid #FCFBF8; border-radius: 8px; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#cdcabf;">
  <div style="width:1920px;height:1080px;flex:none;background:#FCFBF8;overflow:hidden;display:flex;flex-direction:column;position:relative;">

    <!-- ===================== TOP TOOLBAR ===================== -->
    <div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#F4F2EC;border-bottom:1px solid #C9C4B6;color:#1A1916;z-index:5;">
      <div style="display:flex;align-items:center;gap:26px;">
        <div style="width:15px;height:15px;border-radius:50%;background:#C8341E;cursor:pointer;"></div>
        <div style="font-weight:700;font-size:15px;letter-spacing:0.01em;">Calendar</div>
        <sc-for list="{{ menus }}" as="m" hint-placeholder-count="4">
          <div style="font-size:15px;font-weight:500;cursor:default;padding:3px 7px;border-radius:2px;" style-hover="background:#1A1916;color:#F4F2EC;">{{ m }}</div>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:20px;font-size:14px;">
        <div style="display:flex;align-items:center;gap:8px;"><div style="width:17px;height:17px;color:#1A1916;display:flex;">{{ signalGlyph }}</div><span style="font-weight:600;letter-spacing:0.04em;">LoRa</span><span style="color:#9A958A;">· {{ loraNodes }}</span></div>
        <div style="width:1px;height:16px;background:#C9C4B6;"></div>
        <div style="font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0.02em;">{{ clock }}</div>
        <div style="color:#6E695E;">{{ dateLong }}</div>
      </div>
    </div>

    <!-- ===================== BODY ===================== -->
    <div style="flex:1;display:flex;min-height:0;">

      <!-- ============ SIDEBAR ============ -->
      <div style="width:300px;flex:none;background:#F1EEE6;border-right:1px solid #D7D2C5;display:flex;flex-direction:column;min-height:0;padding:24px 22px;">
        <!-- mini month -->
        <div style="margin-bottom:30px;">
          <div style="font-size:15px;font-weight:700;color:#1A1916;margin-bottom:14px;">June 2026</div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;">
            <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
              <div style="text-align:center;font-size:10.5px;color:#B0AB9D;font-weight:600;">{{ w }}</div>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);">
            <sc-for list="{{ miniCells }}" as="c" hint-placeholder-count="30">
              <div style="height:30px;display:flex;align-items:center;justify-content:center;"><div style="{{ c.pill }}">{{ c.day }}</div></div>
            </sc-for>
          </div>
        </div>
        <!-- calendars -->
        <div style="font-size:11px;letter-spacing:0.13em;text-transform:uppercase;color:#A39D8F;font-weight:600;margin-bottom:12px;">Calendars</div>
        <sc-for list="{{ calendars }}" as="cal" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:12px;padding:8px 6px;cursor:pointer;border-radius:2px;" style-hover="background:#E6DFCE;">
            <div style="{{ cal.box }}">{{ cal.check }}</div>
            <span style="flex:1;font-size:14.5px;color:#2A2620;">{{ cal.label }}</span>
          </div>
        </sc-for>
      </div>

      <!-- ============ MONTH VIEW ============ -->
      <div style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;">
        <!-- header -->
        <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:26px 40px 20px;">
          <div style="display:flex;align-items:center;gap:20px;">
            <div style="font-size:30px;font-weight:700;color:#1A1916;letter-spacing:-0.02em;">June 2026</div>
            <div style="display:flex;gap:4px;">
              <div style="width:34px;height:34px;border:1px solid #C4BFB1;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#FCFBF8;color:#3A362E;" style-hover="background:#ECE8DD;"><div style="width:18px;height:18px;display:flex;">{{ prevGlyph }}</div></div>
              <div style="width:34px;height:34px;border:1px solid #C4BFB1;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#FCFBF8;color:#3A362E;" style-hover="background:#ECE8DD;"><div style="width:18px;height:18px;display:flex;">{{ nextGlyph }}</div></div>
            </div>
            <div style="height:34px;padding:0 16px;border:1px solid #C4BFB1;border-radius:2px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#1A1916;cursor:pointer;background:#FCFBF8;" style-hover="background:#ECE8DD;">Today</div>
          </div>
          <div style="display:flex;border:1px solid #C4BFB1;border-radius:2px;overflow:hidden;font-size:14px;">
            <div style="padding:8px 16px;cursor:pointer;color:#3A362E;background:#FCFBF8;border-right:1px solid #C4BFB1;" style-hover="background:#ECE8DD;">Day</div>
            <div style="padding:8px 16px;cursor:pointer;color:#3A362E;background:#FCFBF8;border-right:1px solid #C4BFB1;" style-hover="background:#ECE8DD;">Week</div>
            <div style="padding:8px 16px;cursor:default;color:#FCFBF8;background:#1A1916;font-weight:600;">Month</div>
          </div>
        </div>
        <!-- weekday header -->
        <div style="flex:none;display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #D7D2C5;border-bottom:1px solid #D7D2C5;background:#F7F5EE;">
          <sc-for list="{{ weekdaysFull }}" as="w" hint-placeholder-count="7">
            <div style="padding:9px 14px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#8A857A;font-weight:600;">{{ w }}</div>
          </sc-for>
        </div>
        <!-- grid -->
        <div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);min-height:0;">
          <sc-for list="{{ monthCells }}" as="c" hint-placeholder-count="35">
            <div style="{{ c.cellStyle }}">
              <div style="display:flex;justify-content:flex-end;margin-bottom:6px;"><div style="{{ c.numStyle }}">{{ c.day }}</div></div>
              <sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="0">
                <div style="{{ ch.style }}">{{ ch.label }}</div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  state = { now: new Date(2026, 5, 20, 9, 41, 0) };

  calMeta = [
    { label: "Personal", color: "#9A7B4F", on: true },
    { label: "Studio", color: "#6E7B57", on: true },
    { label: "Manuscript", color: "#4A5E73", on: true },
    { label: "Deadlines", color: "#C8341E", on: true },
  ];

  // events keyed by day-of-month
  evMap = {
    3: [{ t: "Studio install", c: "#6E7B57" }],
    6: [{ t: "Farmers market", c: "#9A7B4F" }],
    9: [{ t: "PHIL 204 lecture", c: "#4A5E73" }],
    12: [{ t: "Synopsis due", c: "#C8341E" }, { t: "Dinner — Sam", c: "#9A7B4F" }],
    15: [{ t: "Studio time", c: "#6E7B57" }],
    18: [{ t: "Rent — cash", c: "#9A7B4F" }],
    20: [{ t: "Studio time", c: "#6E7B57" }, { t: "Lunch — Dey", c: "#9A7B4F" }, { t: "Reading @ Greenlight", c: "#4A5E73" }],
    23: [{ t: "Chapter 8 due", c: "#C8341E" }],
    24: [{ t: "Call: agent", c: "#4A5E73" }],
    27: [{ t: "Brighton trip", c: "#9A7B4F" }],
  };

  componentDidMount() { this.timer = setInterval(() => this.setState((s) => ({ now: new Date(s.now.getTime() + 60000) })), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }

  pad(n) { return n < 10 ? "0" + n : "" + n; }
  clockStr() { const n = this.state.now; return this.pad(n.getHours()) + ":" + this.pad(n.getMinutes()); }
  dateLong() { const d = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]; const n = this.state.now; return d[n.getDay()] + " " + n.getDate() + " June"; }

  icon(k) {
    const E = React.createElement;
    const P = (d) => E("path", { d });
    const C = (cx, cy, r) => E("circle", { cx, cy, r });
    const R = (x, y, w, h, r) => E("rect", { x, y, width: w, height: h, rx: r || 0 });
    const S = (...c) => E("svg", { viewBox: "0 0 24 24", width: "100%", height: "100%", fill: "none", stroke: "currentColor", strokeWidth: 1.6, strokeLinecap: "round", strokeLinejoin: "round" }, ...c);
    switch (k) {
      case "signal": return S(P("M2 11.5a14 14 0 0 1 20 0"), P("M5.5 14a9 9 0 0 1 13 0"), P("M9 16.4a4.5 4.5 0 0 1 6 0"), C(12, 18.6, 0.7));
      case "prev": return S(P("M15 5l-7 7 7 7"));
      case "next": return S(P("M9 5l7 7-7 7"));
      default: return S(R(5, 5, 14, 14, 1));
    }
  }
  check() { const E = React.createElement; return E("svg", { viewBox: "0 0 24 24", width: 12, height: 12, fill: "none", stroke: "currentColor", strokeWidth: 2.6, strokeLinecap: "round", strokeLinejoin: "round" }, E("path", { d: "M5 12.5 10 17.5 19 7" })); }

  renderVals() {
    const calendars = this.calMeta.map((c) => ({
      label: c.label,
      box: "width:18px;height:18px;flex:none;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;background:" + c.color + ";",
      check: this.check(),
    }));

    // mini month
    const miniCells = [];
    for (let d = 1; d <= 30; d++) {
      const today = d === 20;
      miniCells.push({
        day: d,
        pill: today
          ? "width:26px;height:26px;border-radius:50%;background:#C8341E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;"
          : "width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:" + (this.evMap[d] ? "#1A1916;font-weight:700;" : "#6E695E;"),
      });
    }

    // month grid: June 1 2026 = Monday -> 0 leading blanks (Mon-start)
    const monthCells = [];
    for (let d = 1; d <= 30; d++) {
      const today = d === 20;
      const evs = this.evMap[d] || [];
      const isWeekend = ((d - 1) % 7) >= 5; // Sat/Sun columns (Mon-start)
      monthCells.push({
        day: d,
        cellStyle: "border-right:1px solid #E6E1D4;border-bottom:1px solid #E6E1D4;padding:8px 10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:" + (isWeekend ? "#F7F5EE" : "#FCFBF8") + ";",
        numStyle: today
          ? "width:28px;height:28px;border-radius:50%;background:#C8341E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;"
          : "width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;color:#3A362E;",
        chips: evs.map((e) => ({
          label: e.t,
          style: "font-size:12px;color:#1A1916;padding:3px 8px;margin-bottom:4px;border-radius:2px;border-left:3px solid " + e.c + ";background:#F1EEE6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;",
        })),
      });
    }

    return {
      menus: ["File", "Edit", "View", "Go"],
      clock: this.clockStr(), dateLong: this.dateLong(), loraNodes: "4 nodes",
      signalGlyph: this.icon("signal"), prevGlyph: this.icon("prev"), nextGlyph: this.icon("next"),
      weekdays: ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"],
      weekdaysFull: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
      calendars, miniCells, monthCells,
    };
  }
}
</script>
</body>
</html>
