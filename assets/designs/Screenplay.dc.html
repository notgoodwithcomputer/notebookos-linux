<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; background: #cdcabf; }
  [contenteditable] { outline: none; caret-color: #C8341E; }
  ::selection { background: #F1D9D2; }
  .sp-scroll::-webkit-scrollbar { width: 12px; }
  .sp-scroll::-webkit-scrollbar-thumb { background: #C7C0AF; border: 3px solid #E4DFD2; border-radius: 8px; }
</style>
</helmet>

<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#cdcabf;">
  <div style="width:1920px;height:1080px;flex:none;background:#E4DFD2;overflow:hidden;display:flex;flex-direction:column;position:relative;">

    <!-- ===================== TOP TOOLBAR ===================== -->
    <div style="height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#F4F2EC;border-bottom:1px solid #C9C4B6;color:#1A1916;z-index:5;">
      <div style="display:flex;align-items:center;gap:26px;">
        <div style="width:15px;height:15px;border-radius:50%;background:#C8341E;cursor:pointer;"></div>
        <div style="font-weight:700;font-size:15px;letter-spacing:0.01em;">Screenplay</div>
        <sc-for list="{{ menus }}" as="m" hint-placeholder-count="5">
          <div style="font-size:15px;font-weight:500;cursor:default;padding:3px 7px;border-radius:2px;" style-hover="background:#1A1916;color:#F4F2EC;">{{ m }}</div>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:20px;font-size:14px;">
        <div style="display:flex;align-items:center;gap:8px;"><div style="width:17px;height:17px;color:#1A1916;display:flex;">{{ signalGlyph }}</div><span style="font-weight:600;letter-spacing:0.04em;">LoRa</span><span style="color:#9A958A;">· {{ loraNodes }}</span></div>
        <div style="width:1px;height:16px;background:#C9C4B6;"></div>
        <div style="font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0.02em;">{{ clock }}</div>
        <div style="color:#6E695E;">{{ dateLong }}</div>
      </div>
    </div>

    <!-- ===================== FORMAT BAR (script elements) ===================== -->
    <div style="height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 36px;background:#FBFAF6;border-bottom:1px solid #E6E1D4;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#A39D8F;font-weight:600;margin-right:6px;">Element</span>
        <sc-for list="{{ elements }}" as="el" hint-placeholder-count="6">
          <div onClick="{{ el.onClick }}" style="{{ el.style }}" style-hover="background:#EFEBE0;">{{ el.label }}</div>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:18px;font-size:13.5px;color:#8A857A;">
        <div style="font-variant-numeric:tabular-nums;">3 pages</div>
        <div style="width:1px;height:16px;background:#E0DBCE;"></div>
        <div style="font-variant-numeric:tabular-nums;">{{ wordCount }} words</div>
        <div style="width:1px;height:16px;background:#E0DBCE;"></div>
        <div style="display:flex;align-items:center;gap:8px;"><div style="{{ saveDot }}"></div><span>{{ saveText }}</span></div>
      </div>
    </div>

    <!-- ===================== CANVAS (page) ===================== -->
    <div class="sp-scroll" style="flex:1;overflow-y:auto;min-height:0;background:#E4DFD2;">
      <div style="max-width:820px;margin:0 auto;padding:48px 24px 120px;">
        <div style="background:#FFFFFF;border:1px solid #D9D3C5;box-shadow:0 2px 14px rgba(26,25,22,0.10);padding:74px 92px 96px;position:relative;min-height:1040px;">
          <div style="position:absolute;top:34px;right:60px;font-family:'Courier Prime',monospace;font-size:15px;color:#9A958A;">1.</div>
          <div style="text-align:center;margin-bottom:56px;font-family:'Courier Prime',monospace;color:#1A1916;">
            <div style="font-size:18px;font-weight:700;letter-spacing:0.04em;">THE TIN ALMANAC</div>
            <div style="font-size:15px;margin-top:14px;color:#6E695E;">An original screenplay</div>
          </div>
          {{ bodyNode }}
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  state = { now: new Date(2026, 5, 20, 9, 41, 0), el: 1, words: 0, saved: true, savedAt: "09:41" };

  elementNames = ["Scene", "Action", "Character", "Dialogue", "Paren.", "Transition"];

  script =
    '<p style="margin:0 0 18px;text-transform:uppercase;font-weight:700;">INT. RADIO SHOP &mdash; CONEY ISLAND AVENUE &mdash; DAY</p>' +
    '<p style="margin:0 0 18px;">A narrow shop crowded with transmitters and coiled wire. REUBEN (60s, careful, overcoat) sets a butter-cookie tin on the counter. The SHOPKEEPER eyes it without surprise.</p>' +
    '<p style="margin:14px 0 0;padding-left:38%;text-transform:uppercase;">Shopkeeper</p>' +
    '<p style="margin:0 0 14px;padding-left:22%;padding-right:18%;">You again. How many sets does one man need?</p>' +
    '<p style="margin:14px 0 0;padding-left:38%;text-transform:uppercase;">Reuben</p>' +
    '<p style="margin:0;padding-left:30%;padding-right:24%;">(placing exact cash on the glass)</p>' +
    '<p style="margin:0 0 14px;padding-left:22%;padding-right:18%;">One more than I have. The last three went out and never came back.</p>' +
    '<p style="margin:0 0 18px;">The Shopkeeper slides a small LoRa unit across the counter. It is the size of a matchbox and twice as honest.</p>' +
    '<p style="margin:14px 0 0;padding-left:38%;text-transform:uppercase;">Shopkeeper</p>' +
    '<p style="margin:0 0 14px;padding-left:22%;padding-right:18%;">A message is a door, Reuben. You have to walk through it. Not stand in it.</p>' +
    '<p style="margin:18px 0;text-align:right;text-transform:uppercase;">Cut to:</p>' +
    '<p style="margin:0 0 18px;text-transform:uppercase;font-weight:700;">EXT. BRIGHTON BEACH &mdash; DUSK</p>' +
    '<p style="margin:0 0 18px;">Wind off the water. REUBEN holds the unit up to a grey horizon and waits for a light that may not come. It does not. He waits anyway.</p>';

  componentDidMount() { this.timer = setInterval(() => this.setState((s) => ({ now: new Date(s.now.getTime() + 60000) })), 1000); }
  componentWillUnmount() { clearInterval(this.timer); if (this.saveT) clearTimeout(this.saveT); }

  pad(n) { return n < 10 ? "0" + n : "" + n; }
  clockStr() { const n = this.state.now; return this.pad(n.getHours()) + ":" + this.pad(n.getMinutes()); }
  dateLong() { const d = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]; const n = this.state.now; return d[n.getDay()] + " " + n.getDate() + " June"; }

  bodyRefCb = (el) => { this.editorEl = el; if (el) this.recount(); };
  onEditCb = () => this.onEdit();
  recount() {
    if (!this.editorEl) return;
    const txt = (this.editorEl.innerText || "").trim();
    const n = txt ? (txt.match(/\S+/g) || []).length : 0;
    if (n !== this.state.words) this.setState({ words: n });
  }
  onEdit() {
    this.recount();
    this.setState({ saved: false });
    if (this.saveT) clearTimeout(this.saveT);
    this.saveT = setTimeout(() => this.setState({ saved: true, savedAt: this.clockStr() }), 900);
  }

  icon(k) {
    const E = React.createElement;
    const P = (d) => E("path", { d });
    const C = (cx, cy, r) => E("circle", { cx, cy, r });
    const R = (x, y, w, h, r) => E("rect", { x, y, width: w, height: h, rx: r || 0 });
    const S = (...c) => E("svg", { viewBox: "0 0 24 24", width: "100%", height: "100%", fill: "none", stroke: "currentColor", strokeWidth: 1.6, strokeLinecap: "round", strokeLinejoin: "round" }, ...c);
    if (k === "signal") return S(P("M2 11.5a14 14 0 0 1 20 0"), P("M5.5 14a9 9 0 0 1 13 0"), P("M9 16.4a4.5 4.5 0 0 1 6 0"), C(12, 18.6, 0.7));
    return S(R(5, 5, 14, 14, 1));
  }

  renderVals() {
    const elements = this.elementNames.map((label, i) => ({
      label,
      onClick: () => this.setState({ el: i }),
      style: "height:32px;padding:0 13px;display:flex;align-items:center;border-radius:2px;cursor:pointer;font-size:13.5px;font-weight:500;border:1px solid "
        + (i === this.state.el ? "#1A1916;background:#1A1916;color:#FCFBF8;" : "#DCD7C9;background:#FCFBF8;color:#3A362E;"),
    }));

    const bodyNode = React.createElement("div", {
      key: "script", contentEditable: true,
      ref: this.bodyRefCb, onInput: this.onEditCb,
      style: { fontFamily: "'Courier Prime', 'Courier New', monospace", fontSize: "16.5px", lineHeight: 1.5, color: "#1A1916" },
      dangerouslySetInnerHTML: { __html: this.script },
    });

    return {
      menus: ["File", "Edit", "Format", "Production", "View"],
      clock: this.clockStr(), dateLong: this.dateLong(), loraNodes: "4 nodes",
      signalGlyph: this.icon("signal"),
      elements, bodyNode,
      wordCount: this.state.words.toLocaleString(),
      saveText: this.state.saved ? "Saved " + this.state.savedAt : "Saving\u2026",
      saveDot: "width:8px;height:8px;border-radius:50%;flex:none;background:" + (this.state.saved ? "#7FA98C" : "#C8341E") + ";",
    };
  }
}
</script>
</body>
</html>
