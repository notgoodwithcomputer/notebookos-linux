[Settings]
gtk-theme-name=Papertone
gtk-cursor-theme-name=notebook
gtk-cursor-theme-size=32
gtk-cursor-blink=true
gtk-application-prefer-dark-theme=false

# ---------------------------------------------------------------- text render
# There is no XSETTINGS daemon in this session, so THIS FILE is what GTK reads.
# Left unset, GTK passes -1/NULL for each of these and defers to whatever
# fontconfig answers per font pattern. fontconfig's shipped defaults already
# agree with every value below (10-yes-antialias, 10-hinting-slight,
# 10-sub-pixel-none), so these are not a change of behaviour — they are a PIN,
# so that the way type looks stops depending on which fontconfig fragments a
# future buildroot bump happens to install.
#
# Why these values and not the "sharper" ones:
#
#   hintslight — hint the baseline and x-height only, and leave horizontal stem
#     positions where the typeface designer put them. Full hinting snaps stems
#     onto the pixel grid, which is what produces the hard, mechanical look of a
#     stock Linux desktop; it buys crispness at 96dpi by deforming the letter-
#     shapes. Nimbus Sans is a Helvetica design with tight, even spacing and it
#     is exactly the kind of face that full hinting wrecks. Slight hinting is
#     also what macOS/iOS effectively do, which is the bar this OS is measured
#     against.
#
#   rgba=none — GRAYSCALE antialiasing, not subpixel/LCD. Subpixel AA is only
#     correct when the panel's subpixel order is actually known: it is wrong on
#     a rotated screen, wrong on most OLED (non-RGB-stripe) panels, and wrong on
#     any external display whose order differs from the built-in one, where it
#     shows up as coloured fringes on every letter. This OS ships to unknown
#     hardware and mirrors onto televisions, so it can never know that order.
#     Apple removed subpixel AA in 2018 for the same reason; grayscale is both
#     the safe answer and the one that matches the target look.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none

# The interface face and its base size, stated once. The Papertone theme already
# forces font-family on `*`, so this mainly pins the SIZE — GTK's built-in
# default is "Sans 10" and every layout in the OS was drawn against that metric.
# Stating it here means the base size no longer depends on a GTK default that
# could move under us.
gtk-font-name=Helvetica Neue 10

# NOTE: gtk-xft-dpi is deliberately NOT set here. It is the one value in this
# block that must follow the panel rather than the file — pinning it would
# defeat the HiDPI scaling session.sh computes at boot. See display.sh.
