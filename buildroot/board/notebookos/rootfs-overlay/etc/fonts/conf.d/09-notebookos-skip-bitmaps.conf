<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Keep the X11 core bitmap fonts out of font SELECTION.

  /usr/share/fonts/X11 holds 337 PCF bitmap fonts that exist only so the X
  server can open its core fonts ("fixed", "cursor"); nothing in this desktop
  renders through them — GTK/Pango resolve everything via fontconfig from the
  DejaVu / Liberation / Notebook OS TrueType faces.

  NOTE what this file does and does not do. <rejectfont> filters at MATCH time
  only: it stops those faces being chosen, but fontconfig still opens and parses
  all 337 of them when it builds its cache. This file was once believed to buy
  the cold-cache startup time back; measured, it does not (10.51s either way).
  What actually removes the scan is that the directory is no longer under one
  fontconfig looks in — post-build.sh moves the tree to /usr/share/X11/fonts and
  points the X server there. That took the cold scan to 6.85s.

  So this rule is now a backstop rather than the mechanism: if that move ever
  does not happen, these faces still must not be selectable, or the desktop
  would start rendering in a bitmap font.

  Numbered 09 so it lands before the fontconfig cache/dir setup in 10-*.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/X11/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
