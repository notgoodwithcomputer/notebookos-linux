<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Notebook OS font aliases. The design language names three faces; map them to
  the typefaces actually shipped in /usr/share/fonts/notebookos so GTK/Pango
  resolve them exactly instead of falling back.
    "Helvetica Neue" -> Nimbus Sans       (assets/nimbus-sans, URW base35)
    "Newsreader"     -> Liberation Serif  (serif document bodies)
    "Courier New"    -> Liberation Mono   (node IDs, counters)

  The interface face is Nimbus Sans — URW's Helvetica-metric-compatible design,
  published by (URW)++ / Artifex under the AGPL with a font exception. It
  REPLACES the "Helvetica.ttf" this image used to ship, a third-party file
  carrying the Helvetica name with no license to redistribute it. Nimbus Sans is
  metric-compatible, so the layouts the design was drawn against are unchanged.

  "Helvetica" is aliased here too: the name is still written into saved documents
  (Writer stores a family name per text tag) and into older config files, and
  fontconfig's stock 30-metric-aliases.conf only maps it WEAKLY. A strong alias
  keeps every such reference landing on the face we actually ship instead of on
  whatever 45-latin.conf happens to pick first.
-->
<fontconfig>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Nimbus Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Nimbus Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Newsreader</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <!-- sensible generic defaults -->
  <!-- Pango's generic UI family reaches Fontconfig as "sans" on this stack,
       while CSS commonly asks for "sans-serif". Cover both spellings: without
       the former GTK's default text resolved to whichever installed sans face
       won the global scan (measured as Fira Sans), not the desktop's Nimbus
       Sans interface face. -->
  <alias binding="strong"><family>sans</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
