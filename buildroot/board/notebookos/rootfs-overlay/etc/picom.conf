# Notebook OS compositor configuration (picom).
#
# The compositor exists for ONE reason here: to back every window in an
# off-screen pixmap so windows can be moved and resized smoothly, and so a
# dropdown that opens over another window paints correctly. It is NOT here for
# effects — the papertone design language has no shadows, no translucency and
# no animation, so every one of those is off below. They also cost real time on
# a software-rendered machine.
#
# This replaces xcompmgr, which is the reason the desktop turned grey and app
# canvases went black: xcompmgr paints a flat grey root tile when
# _XROOTPMAP_ID is absent, and mishandles windows that carry an ARGB visual, so
# unpainted regions composite as black. picom reads the root pixmap properly
# and handles ARGB windows correctly.

# --- backend -----------------------------------------------------------------
# xrender is the safe universal backend and is what this desktop wants: the
# compositing work here is plain rectangular blits, which xrender does well on
# every stack, including a GPU-less one. (glx is faster for heavy effects, and
# there are none here.) The backend is NOT overridden on the command line --
# picom 10 moved glx behind --legacy-backends, and passing it made the
# compositor exit at once.
backend = "xrender";

# Vblank sync is decided by session.sh, not here.
#
# This said "do not sync to vblank: on the software path there is no real
# vblank" -- but the compositor is only ever STARTED when NB_ACCEL=1, i.e. on a
# machine with a real KMS driver bound, which is exactly where a vblank does
# exist. So the one setting that stops the screen showing half of the old frame
# and half of the new one was switched off on precisely the hardware that could
# honour it, and the desktop tore and stuttered as a result.
#
# It stays false HERE so that forcing the compositor on with nb.compositor=1 on
# a software machine cannot stall the desktop waiting for a blank that never
# comes. session.sh passes --vsync when the GPU is genuinely accelerated.
vsync = false;

# --- window shadows ----------------------------------------------------------
# THE ONE EFFECT THIS COMPOSITOR DOES.
#
# Everything else here stays off (see below), but a window with no shadow at all
# has no front-to-back order: two overlapping app windows on the papertone field
# are two flat rectangles of nearly the same colour, and the only thing telling
# you which is in front is which one's hairline border got cut off. That is the
# whole reason the desktop read as flat rather than as objects on a surface.
#
# The theme carries the same idea for things INSIDE a window (tooltips, menus,
# popovers get a two-layer shadow in Papertone's gtk.css) — but CSS box-shadow
# is clipped to the widget's own allocation, so it can never draw outside a
# toplevel. A real window shadow can only come from the compositor. This is that
# half of the elevation system, and the numbers are chosen to match the CSS one.
#
# PAPER, NOT MATERIAL. A sheet resting on another sheet casts a short, soft,
# nearly colourless shadow:
#   * warm INK, never black — pure black over the #DED4C2 field reads grey-blue;
#   * low opacity, wide radius: present when you look for it, invisible when you
#     do not;
#   * straight down. Light is from above; a diagonal offset would imply a light
#     source nothing else in the interface has.
# With radius R, an offset of -R centres the shadow on the window, so -R plus a
# few pixels is what biases it downward: 20 and -14 give a 6px drop.
#
# COST: this only ever runs on NB_ACCEL=1 machines (session.sh starts the
# compositor nowhere else), so a software-rendered laptop pays nothing for it.
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.16;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-color = "#1A1916";

# --- effects: the rest off, deliberately -------------------------------------
fading = false;
blur-background = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-dim = 0.0;

# Never dim or fade menus/dropdowns; they must appear instantly and opaque.
opacity-rule = [ "100:class_g = 'Shell.py'",
                 "100:class_g = 'Finder.py'" ];

# --- correctness -------------------------------------------------------------
# Repaint the whole frame rather than only the regions X reports as damaged.
#
# use-damage = true is the faster setting and is normally right, but it trusts
# every client to report its damage correctly. Clients that paint through their
# own path — VTE (the Terminal) is the classic one — can under-report, and the
# compositor then keeps showing a STALE region: the shell runs the command and
# prints the result, but that part of the screen never updates, so it reads as
# "typing does nothing / commands not working".
#
# This desktop composites plain opaque rectangles with no shadow, fade or blur,
# and the machines it targets have a real GPU, so a full repaint is cheap and
# correctness wins. Set this back to true if compositing ever shows up as a
# measured cost.
use-damage = false;

# Let windows that ask for an ARGB visual keep it, and composite them properly
# rather than showing black where they have not painted.
detect-client-opacity = true;

# Track the real window type/role so dialogs, dropdown menus and the docked
# panel are treated correctly in the stack.
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-transient = true;
detect-client-leader = true;

# The panel is an override-redirect-ish DOCK and menus are POPUP/DROPDOWN
# windows; unredirecting a fullscreen window would hide them, so never do it.
unredir-if-possible = false;

# WHICH WINDOWS GET ONE. Only things that genuinely float above the page.
# Everything switched off below is off for a specific reason, not for tidiness:
#
#   desktop  desktopbg.py's backdrop window (_NET_WM_WINDOW_TYPE_DESKTOP) IS the
#            page. A shadow on it would draw a dark band around the whole screen.
#   dock     the panel is docked to the top edge with a strut; a shadow under it
#            would fall on the desktop as a permanent smear along the top.
#   splash   the loading and sign-in screens are full-screen, so a shadow is
#            entirely off-screen — pure cost, no pixels.
#   menus /  these already carry their own two-layer shadow from the theme's CSS
#   tooltip  (GTK reserves the space for it and draws it in the ARGB window), so
#            a compositor shadow on top would double it and read as a smudge.
#
# normal and dialog are the two that are ON: app windows and the confirmations
# that sit over them, which is exactly the pair the user needs ordered.
# THE DESKTOP BOARD IS NOT A FLOATING WINDOW.
#
# widgets.py draws the whole desktop board -- eight cards -- inside ONE window,
# and sets _NET_WM_WINDOW_TYPE_DIALOG so the matchbox patch can pin it to the
# bottom of the stack. That type hint also matched `dialog` below, so the
# compositor drew a single shadow around the OUTSIDE of the whole grid: the
# eight cards read as one shaded slab sitting on the desktop instead of as
# eight separate sheets resting on it.
#
# A compositor can only shadow a WINDOW, so per-card elevation cannot come from
# here at all. It comes from the CSS box-shadow on `.card` in widgets.py, which
# is per-card by construction. This window gets nothing.
#
# Matched by NAME, not by type: the type has to stay `dialog` for the stacking
# patch, and the name is already load-bearing for exactly that reason (see the
# set_title comment in widgets.py), so it is the stable handle of the two.
shadow-exclude = [ "name = 'nb-desktop-widgets'" ];

wintypes:
{
  desktop = { shadow = false; };
  dock = { shadow = false; };
  splash = { shadow = false; };
  dropdown_menu = { shadow = false; fade = false; };
  popup_menu = { shadow = false; fade = false; };
  menu = { shadow = false; fade = false; };
  tooltip = { shadow = false; fade = false; opacity = 1.0; };
  dialog = { shadow = true; fade = false; };
  normal = { shadow = true; fade = false; };
};
