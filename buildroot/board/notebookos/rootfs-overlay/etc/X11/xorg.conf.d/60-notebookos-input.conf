# Force the pointer onto the evdev driver.
#
# The QEMU usb-tablet — and absolute pointing devices in general — report
# ABS_X/ABS_Y with no relative motion. libinput does NOT emit pointer motion for
# such devices (it only drives relative mice, touchscreens, and pen tablets), so
# when X binds the tablet with libinput the cursor freezes the moment the GUI
# comes up. The older evdev driver handles absolute pointers correctly.
#
# This file sorts after the system's 40-libinput.conf, and "the last InputClass
# that names a Driver wins", so it overrides libinput for pointers/touch devices
# while leaving the keyboard on libinput.
Section "InputClass"
    Identifier "notebookos absolute pointer -> evdev"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
EndSection

# Touchscreens go to LIBINPUT, deliberately and explicitly.
#
# This section used to force touchscreens onto evdev alongside the pointer rule
# above — pure caution, since QEMU exposes no touchscreen device at all (its
# usb-tablet is a POINTER and stays on evdev via the rule above). The cost was
# real: under evdev a touchscreen is a click-only absolute pointer — no XI2
# touch sequences, so GTK never engages kinetic scrolling and multi-touch is
# invisible. libinput is the driver that speaks touch. Stated explicitly (not
# by deleting the section) so the intent survives the "last Driver wins"
# ordering rule this directory depends on.
Section "InputClass"
    Identifier "notebookos touchscreen -> libinput"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection

# Pen tablets go to LIBINPUT too, for the same reason and one more.
#
# evdev would carry a stylus's position, but libinput is the driver that speaks
# the XI2 *tablet-tool* protocol: pressure, tilt, and the pen-vs-eraser identity
# that lets Illustrator switch tools when you flip the pen over. On evdev a pen
# is just another absolute pointer and every one of those is lost.
#
# This section is defensive, not corrective: today a stylus is tagged
# ID_INPUT_TABLET and *not* ID_INPUT_MOUSE (eudev's input_id guards the mouse
# branch with !is_tablet), so the pointer rule above already fails to match it
# and libinput wins from 40-libinput.conf. That is a subtle invariant living in
# someone else's source tree. Naming tablets here means the routing holds even
# if a device, or a future eudev, tags a pen as a pointer as well.
#
# Note this does NOT catch a tablet with no kernel driver: hid-generic gives it
# absolute axes and mouse buttons with no BTN_TOOL_PEN, so it is tagged a plain
# pointer and lands on evdev above — degrading to a working cursor instead of
# nothing, which is what we want. The drivers that stop that happening to real
# hardware are CONFIG_HID_WACOM / CONFIG_HID_UCLOGIC in tools/desktop.config.
Section "InputClass"
    Identifier "notebookos pen tablet -> libinput"
    MatchIsTablet "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
EndSection
