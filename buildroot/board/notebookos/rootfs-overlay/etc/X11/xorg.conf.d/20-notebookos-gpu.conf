# Accelerated presentation, ONLY where there is a real GPU driver bound.
#
# The machine shipped with no display configuration at all, so on real Intel
# hardware X took the modesetting driver's defaults: no explicit glamor, no
# tear-free presentation and DRI left to negotiate. That is what a choppy,
# tearing desktop looks like -- every window move and every menu is composited
# and scanned out with no regard for the vertical blank, so the screen shows
# half of the old frame and half of the new one.
#
# MatchDriver is the whole point of doing it this way. These options are only
# correct when a KMS driver is actually bound; on the plain EFI framebuffer
# (simpledrm, which is what a machine with no supported GPU falls back to)
# asking for glamor would ask a software rasteriser to pretend it is a GPU, and
# the honest outcome there is the software path we already have. An OutputClass
# that names its driver simply does not match in that case, so the software
# machine is untouched by this file.
Section "OutputClass"
    Identifier "notebookos intel"
    MatchDriver "i915"
    Driver "modesetting"
    # glamor: draw through the GPU rather than the CPU.
    Option "AccelMethod" "glamor"
    # TearFree: present whole frames on the vertical blank. This is the single
    # option that turns "choppy and torn" into smooth scrolling and window
    # movement; it costs one extra buffer and is what every desktop that feels
    # solid is doing.
    Option "TearFree" "true"
    # DRI3 lets clients hand buffers straight to the server instead of copying
    # every frame through it.
    Option "DRI" "3"
EndSection

# The same, for the virtio GPU this OS is developed against. virgl gives real
# acceleration in a VM, and without this the VM desktop tears exactly as the
# hardware one did.
Section "OutputClass"
    Identifier "notebookos virtio"
    MatchDriver "virtio_gpu"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
    Option "TearFree" "true"
    Option "DRI" "3"
EndSection
